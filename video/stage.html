<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spec Studio video stage</title>
<style>
  /* The page that demo-video-tool records. Each scene shows one thing:
     a screen clip of the app (?clip), a still screenshot (?still), or a
     terminal that replays a real Claude Code transcript (?term). */
  html, body { margin: 0; height: 100%; background: #16161e; overflow: hidden; }
  body { display: grid; place-items: center; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  .frame { height: 1000px; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden;
           box-shadow: 0 30px 80px rgb(0 0 0 / 0.55), 0 0 0 1px rgb(255 255 255 / 0.06); background: #1a1b26; }
  .frame video, .frame img { width: 100%; height: 100%; display: block; object-fit: cover; }

  .term { width: 1500px; height: 900px; border-radius: 14px; background: #1a1b26; color: #c0caf5;
          box-shadow: 0 30px 80px rgb(0 0 0 / 0.55), 0 0 0 1px rgb(255 255 255 / 0.06);
          font: 25px/1.5 "SF Mono", Menlo, monospace; display: flex; flex-direction: column; overflow: hidden; }
  .term .bar { height: 44px; background: #16161e; display: flex; align-items: center; gap: 10px; padding: 0 18px;
               color: #565f89; font: 15px system-ui; }
  .term .bar i { width: 13px; height: 13px; border-radius: 50%; background: #3b3f57; display: inline-block; }
  .term .bar span { margin-left: 14px; }
  .term .body { padding: 26px 34px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; flex: 1; }
  .prompt { color: #c0caf5; }
  .prompt b { color: #7aa2f7; font-weight: 600; }
  .tool { color: #9ece6a; margin-top: 14px; }
  .tool small { color: #565f89; font-size: 22px; }
  .answer { margin-top: 16px; white-space: pre-wrap; color: #a9b1d6; }
  .answer code { color: #e0af68; }
  .answer strong { color: #c0caf5; }
  .answer blockquote { margin: 6px 0; padding-left: 18px; border-left: 3px solid #3b4261; color: #bb9af7; }
  .caret { display: inline-block; width: 13px; height: 28px; background: #7aa2f7; vertical-align: -5px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ?still=...&zoom=x,y: play(seconds) moves in slowly on the point x%,y%. */
  .frame.seq { position: relative; }
  .frame.seq img { position: absolute; inset: 0; transition: opacity .6s ease; }
  .frame.seq img.off { opacity: 0; }
  .frame img.zoom { transform-origin: var(--zx, 50%) var(--zy, 50%); transition: transform var(--zs, 10s) cubic-bezier(.3,.1,.3,1); }
  .frame img.zoom.in { transform: scale(var(--zk, 1.35)); }

  /* ?diagram=<part>: the relay and its backends. focus(part) lights one part. */
  .dia { width: 1720px; height: 960px; position: relative; color: #c0caf5; font: 26px/1.35 -apple-system, system-ui, sans-serif; }
  .box { position: absolute; box-sizing: border-box; border-radius: 16px; background: #1f2335; border: 2px solid #3b4261; padding: 22px 26px;
         transition: opacity .7s ease, border-color .7s ease, box-shadow .7s ease; }
  .box h3 { margin: 0 0 6px; font-size: 30px; font-weight: 650; color: #c0caf5; }
  .box p { margin: 0; color: #9aa5ce; font-size: 23px; }
  .box .tag { display: inline-block; margin-left: 10px; padding: 2px 10px; border-radius: 6px; font-size: 18px; font-weight: 600; vertical-align: 4px; }
  .tag.def { background: #9ece6a22; color: #9ece6a; } .tag.opt { background: #7aa2f722; color: #7aa2f7; }
  .box.lit { border-color: #7aa2f7; box-shadow: 0 0 0 6px #7aa2f722, 0 20px 50px rgb(0 0 0 / .4); }
  .dia.focused .box:not(.lit):not(.keep) { opacity: .28; }
  .links { position: absolute; left: 0; top: 0; overflow: visible; }
  .wire { transition: opacity .7s ease; }
  .wire path { fill: none; stroke: #565f89; stroke-width: 2.5; stroke-dasharray: 8 7; }
  .wire text { fill: #737aa2; font: 19px "SF Mono", Menlo, monospace; text-anchor: middle; }
  .wire.lit path { stroke: #7aa2f7; } .wire.lit text { fill: #a9b1d6; }
  .dia.focused .wire:not(.lit), .dia.focused .group:not(.lit), .dia.focused .note:not(.lit) { opacity: .28; }
  .group { position: absolute; border: 2px dashed #3b4261; border-radius: 20px; transition: opacity .7s ease, border-color .7s ease; }
  .group span { position: absolute; top: -15px; left: 24px; padding: 0 10px; background: #16161e; color: #737aa2; font: 19px "SF Mono", Menlo, monospace; }
  .group.lit { border-color: #7aa2f7; } .group.lit span { color: #a9b1d6; }
  .note { position: absolute; color: #737aa2; font: 21px -apple-system, system-ui, sans-serif; transition: opacity .7s ease; }
  .settings { position: absolute; left: 0; right: 0; bottom: 0; height: 236px; box-sizing: border-box; border-radius: 14px; background: #16161e;
              border: 2px solid #292e42; padding: 22px 30px; font: 24px/1.55 "SF Mono", Menlo, monospace; color: #a9b1d6;
              white-space: pre; transition: opacity .5s ease; overflow: hidden; }
  .settings .k { color: #7dcfff; } .settings .c { color: #565f89; } .settings .s { color: #e0af68; }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const html = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // A little Markdown for the answers: code, bold, quotes, list dashes.
  const md = (s) => html(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');

  if (params.has('clip')) {
    // &from=<s>&to=<s> plays one part of the clip: it opens on the frame at
    // `from` and holds the frame at `to`.
    const from = Number(params.get('from') ?? 0), to = Number(params.get('to') ?? Infinity);
    document.body.innerHTML = `<div class="frame"><video muted playsinline preload="auto" src="clips/${params.get('clip')}.webm"></video></div>`;
    const video = document.querySelector('video');
    video.addEventListener('timeupdate', () => { if (video.currentTime >= to) video.pause(); });
    // The scene's run() calls play(rate). The clip holds its last frame at the end.
    window.play = (rate = 1) => { video.playbackRate = rate; return video.play(); };
    window.ready = async () => {
      await new Promise((ok) => video.readyState >= 2 ? ok() : video.addEventListener('loadeddata', ok, { once: true }));
      if (from) await new Promise((ok) => { video.addEventListener('seeked', ok, { once: true }); video.currentTime = from; });
    };
  } else if (params.has('still') && params.get('still').includes(',')) {
    // ?still=a,b,c: play(seconds) shows each still in turn over `seconds`, with a crossfade.
    const srcs = params.get('still').split(',');
    document.body.innerHTML = `<div class="frame seq">${srcs.map((src, i) => `<img src="${src}" alt=""${i ? ' class="off"' : ''}>`).join('')}</div>`;
    const imgs = [...document.querySelectorAll('img')];
    window.ready = () => Promise.all(imgs.map((img) => img.decode()));
    // play(seconds) spaces the stills evenly; play([t1, t2, ...]) shows still
    // i+1 at t[i] seconds, to follow the narration.
    window.play = async (when = 12) => {
      const times = Array.isArray(when) ? when : imgs.slice(1).map((_, i) => ((i + 1) * when) / imgs.length);
      const t0 = performance.now();
      for (const [i, t] of times.entries()) {
        await new Promise((r) => setTimeout(r, Math.max(0, t * 1000 - (performance.now() - t0))));
        imgs[i + 1].classList.remove('off');
      }
    };
  } else if (params.has('still')) {
    document.body.innerHTML = `<div class="frame"><img src="${params.get('still')}" alt=""></div>`;
    const img = document.querySelector('img');
    // &zoom=x,y[,scale]: play(seconds) moves in on that point of the still.
    if (params.has('zoom')) {
      const [x, y, k] = params.get('zoom').split(',');
      img.classList.add('zoom');
      img.style.setProperty('--zx', `${x}%`); img.style.setProperty('--zy', `${y}%`);
      if (k) img.style.setProperty('--zk', k);
    }
    window.play = (seconds = 10) => { img.style.setProperty('--zs', `${seconds}s`); img.classList.add('in'); };
    window.ready = () => img.decode();
  } else if (params.has('diagram')) {
    diagram(params.get('diagram'));
  } else if (params.has('term')) {
    document.body.innerHTML = `<div class="term"><div class="bar"><i></i><i></i><i></i><span>claude · another computer</span></div><div class="body"></div></div>`;
    const body = document.querySelector('.body');
    window.ready = async () => {};
    // replay(): types the prompt, shows each tool call, then the answer, over `seconds`.
    window.replay = async (seconds = 20) => {
      const t = (await (await fetch('transcripts.json')).json())[params.get('term')];
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const prompt = document.createElement('div');
      prompt.className = 'prompt';
      prompt.innerHTML = '<b>&gt;</b> <span></span><span class="caret"></span>';
      body.append(prompt);
      const typed = prompt.querySelector('span');
      const typeMs = Math.min(45, (seconds * 1000 * 0.3) / t.prompt.length);
      for (const ch of t.prompt) { typed.textContent += ch; await sleep(typeMs); }
      prompt.querySelector('.caret').remove();
      await sleep(600);
      for (const step of t.steps) {
        const el = document.createElement('div');
        if (step.tool) {
          el.className = 'tool';
          const args = Object.keys(step.input).length ? ` <small>${html(JSON.stringify(step.input))}</small>` : '';
          el.innerHTML = `● spec-studio · ${html(step.tool)}${args}`;
          body.append(el);
          await sleep(seconds * 1000 * 0.12);
        } else {
          el.className = 'answer';
          el.innerHTML = md(step.text);
          body.append(el);
        }
      }
    };
  }

  // The relay and its backends, drawn for the relay video. focus(part) lights
  // one part and shows its settings; focus('all') lights everything.
  function diagram(first) {
    const k = (t) => t.replace(/^([A-Z_]+)=/gm, '<span class="k">$1</span>=').replace(/(#.*)$/gm, '<span class="c">$1</span>')
      .replace(/(&lt;[^&]+&gt;)/g, '<span class="s">$1</span>');
    const settings = {
      all: '',
      link: '',
      store: '# The store holds:\n#   the copy of each spec, for when the Mac is offline\n#   the messages, both ways\n#   the pairing and the sign-ins',
      json: '# The default. Leave both out, or set:\nRELAY_STORE=json\nRELAY_DATA_DIR=/data        # mount a volume here',
      temporal: 'RELAY_STORE=temporal\nTEMPORAL_ADDRESS=&lt;namespace&gt;.&lt;account&gt;.tmprl.cloud:7233\nTEMPORAL_NAMESPACE=&lt;namespace&gt;.&lt;account&gt;\nTEMPORAL_API_KEY=&lt;the API key&gt;\nPAYLOAD_KEYS=&lt;from: relay keys&gt;   # encrypts every payload',
      bucket: '# Set all four, or none. R2, S3, MinIO or any S3-compatible bucket.\nBUCKET_ENDPOINT=https://&lt;account id&gt;.r2.cloudflarestorage.com\nBUCKET_NAME=spec-studio-relay\nBUCKET_ACCESS_KEY=&lt;access key ID&gt;\nBUCKET_SECRET_KEY=&lt;secret access key&gt;',
      nobucket: '# No BUCKET_* settings: the relay works, with no attachments.\n# upload_attachment answers:\n#   "The relay has no bucket for attachments."',
      run: '# Docker Compose, Helm or Docker:\ndocker compose up\nhelm install relay oci://ghcr.io/spec-studio-app/charts/relay \\\n  --set publicUrl=https://relay.example.com --set existingSecret=relay-secrets\ndocker run -d -p 8760:8760 -v relay-data:/data --env-file relay.env ghcr.io/spec-studio-app/relay',
    };
    document.body.innerHTML = `<div class="dia">
      <svg class="links" width="1720" height="700" viewBox="0 0 1720 700">
        <g data-part="ai all run link" class="wire"><path d="M432 100 H643"/><text x="537" y="86">HTTPS · OAuth</text></g>
        <g data-part="mac all run link" class="wire"><path d="M1288 100 H1077"/><text x="1182" y="86">WebSocket</text><text x="1182" y="134">the Mac dials out</text></g>
        <g data-part="store json temporal all" class="wire"><path d="M790 182 V236 H440 V286"/></g>
        <g data-part="bucket nobucket all" class="wire"><path d="M930 182 V236 H1280 V286"/></g>
      </svg>
      <div class="box" data-part="ai all run link" style="left:0;top:20px;width:430px"><h3>Claude AI</h3><p>claude.ai, the Claude app, or Claude Code on another computer</p></div>
      <div class="box" data-part="relay all store json temporal bucket nobucket run link" style="left:645px;top:20px;width:430px"><h3>The relay</h3><p>An MCP server that you host, in one container</p></div>
      <div class="box" data-part="mac all run link" style="left:1290px;top:20px;width:430px"><h3>Spec Studio</h3><p>The agent on your Mac. The Mac opens no port.</p></div>
      <div class="group" data-part="store json temporal all" style="left:120px;top:288px;width:640px;height:372px"><span>The store: one of the two</span></div>
      <div class="box" data-part="store json all" style="left:150px;top:340px;width:580px"><h3>JSON files<span class="tag def">default</span></h3><p>On a volume. No other service.</p></div>
      <div class="box" data-part="store temporal all" style="left:150px;top:496px;width:580px"><h3>Temporal<span class="tag opt">option</span></h3><p>Your namespace, on Temporal Cloud or self-hosted</p></div>
      <div class="box" data-part="bucket nobucket all" style="left:960px;top:288px;width:640px"><h3>S3 bucket<span class="tag opt">optional</span></h3><p>The attachments, when you set a bucket: R2, S3, MinIO or any S3-compatible service</p></div>
      <div class="note" data-part="bucket nobucket all" style="left:960px;top:470px;width:640px">Attachments never go into the store.</div>
      <div class="settings"></div>
    </div>`;
    const dia = document.querySelector('.dia'), panel = document.querySelector('.settings');
    window.light = (part) => {
      dia.classList.toggle('focused', part !== 'all');
      for (const el of dia.querySelectorAll('[data-part]')) el.classList.toggle('lit', part !== 'all' && el.dataset.part.split(' ').includes(part));
      // The relay box stays bright: everything is about it.
      dia.querySelector('[data-part^="relay"]').classList.add('keep');
      panel.style.opacity = settings[part] ? 1 : 0;
      if (settings[part]) panel.innerHTML = k(settings[part]);
    };
    window.light(first || 'all');
    window.ready = async () => {};
    window.play = () => {};
  }
</script>
</body>
</html>
