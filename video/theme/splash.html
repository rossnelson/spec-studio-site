<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:"Source Serif 4 Critter";font-style:normal;font-weight:200 900;src:url({{dir}}/fonts/source-serif-4-latin-opsz-normal.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4 Critter";font-style:italic;font-weight:200 900;src:url({{dir}}/fonts/source-serif-4-latin-opsz-italic.woff2) format("woff2")}
html,body{margin:0;width:{{width}}px;height:{{height}}px;overflow:hidden;background:{{colors.bg}};font-family:{{fonts.serif}};color:{{colors.text}}}
.grain{position:absolute;inset:0;opacity:.3;mix-blend-mode:multiply}
.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:96px}
.art img{width:520px}
.text{display:flex;flex-direction:column;gap:22px}
.rule{width:620px;height:1.5px;background:{{colors.rule}}}
h1{margin:0;font-size:112px;line-height:1.02;font-weight:560;letter-spacing:-.015em}
p{margin:0;font-size:38px;font-style:italic;color:{{colors.muted}};max-width:720px}
p:empty{display:none}
</style></head><body>
<svg class="grain" width="100%" height="100%"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .48 0 0 0 0 .42 0 0 0 .16 0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
<div class="card">
  <div class="art"><img src="{{dir}}/critters/wave.webp" alt=""></div>
  <div class="text">
    <div class="rule"></div>
    <h1>{{title}}</h1>
    <p>{{subtitle}}</p>
    <div class="rule"></div>
  </div>
</div>
</body></html>
